
[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ans-data-platform"
version = "0.1.0"
description = "Data engineering platform for ANS open data"
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "python-dotenv",
    "psycopg[binary]",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require external infrastructure, such as RustFS.",
]
